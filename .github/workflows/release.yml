name: release

# Tag vX.Y.Z to publish a GitHub release. Pushes that touch packaging only build and
# smoke-test the artifacts (no release), so installer breakage is caught early.
on:
  push:
    tags: ["v*"]
    branches: [main, production-readiness]
    paths:
      - "packaging/**"
      - "scripts/build.py"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build wheel, bundle and installer
        run: python scripts/build.py --installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.whl
            dist/*.tar.gz

  linux:
    # build on the oldest supported Ubuntu so the bundle runs on newer glibc versions too
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Build bundle
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/YEMU-*-linux-*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "YEMU $GITHUB_REF_NAME" --generate-notes
