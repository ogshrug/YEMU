[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yemu"
dynamic = ["version"]
description = "YEMU: local malware analysis sandbox (QEMU/KVM/WHPX + YARA + behavioural monitoring)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Armaan Guha", email = "armaanguha@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Security",
]
# Cross-platform core: CLI, YARA, reports, mock backend
dependencies = [
    "yara-python>=4.3",
    "aiosqlite>=0.19",
    "reportlab>=4.0",
    "requests>=2.31",
    "scapy>=2.5",
    "platformdirs>=3.0",
    "PyYAML>=6.0",
    "pycdlib>=1.14",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Desktop app (Qt; Windows + Linux)
gui = [
    "PySide6>=6.6",
]
# Linux host with libvirt. libvirt-python is usually taken from the distro
# (python3-libvirt) via `python3 -m venv --system-site-packages`.
linux = [
    "libvirt-python>=9.0; sys_platform == 'linux'",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "PySide6>=6.6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
yemu = "yemu.cli:main"

[project.gui-scripts]
yemu-gui = "yemu.app:main"

[tool.setuptools.dynamic]
version = { attr = "yemu.__version__" }

[tool.setuptools.packages.find]
include = ["yemu*"]

[tool.setuptools.package-data]
yemu = ["rules/*.yar", "gui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["scripts", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E701",  # `if x: return` one-liners are used deliberately in guard clauses
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # tests set env vars / mocks before importing the code under test
"yemu/rules/*" = ["ALL"]
"yemu/gui/theme.py" = ["E501"]           # SVG path data and the stylesheet
"yemu/core/vm_provisioner.py" = ["E501"] # embedded Windows answer-file XML

[tool.mypy]
python_version = "3.12"
packages = ["yemu"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff.format]
quote-style = "preserve"
